name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: generated files are up to date
        run: |
          go generate ./...
          git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...

  # The cases of the Raoh Specification at the commit conformance/spec.lock
  # pins, run on this package and checked by that commit's raoh-verify against
  # conformance/conformance.json.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            conformance/go.sum
      - name: vet the runner
        working-directory: conformance
        run: go vet ./...
      - run: scripts/conformance.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance
          path: |
            conformance/target/runner-result.json
            conformance/target/conformance-report.json
          if-no-files-found: ignore
